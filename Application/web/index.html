<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapSkin - 웹 분석 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #FFFBFE; }
        .rose-gradient { background: vertical-gradient(180deg, #E91E63 0%, #F06292 100%); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .bottom-nav { border-top: 1px solid #eee; }
        .camera-overlay { background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.5) 100%); }
        .landmark { position: absolute; width: 8px; height: 8px; background: #E91E63; border-radius: 50%; box-shadow: 0 0 8px rgba(233,30,99,0.5); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative shadow-xl bg-white">

    <!-- Splash Screen -->
    <div id="splash" class="absolute inset-0 z-50 flex flex-col items-center justify-center rose-gradient text-white" style="background: linear-gradient(180deg, #E91E63 0%, #F06292 100%);">
        <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center pulse mb-6">
            <span class="text-6xl font-black text-[#E91E63]">C</span>
        </div>
        <h1 class="text-4xl font-bold mb-2">CapSkin</h1>
        <p class="opacity-80 tracking-widest text-sm uppercase">Precision Skin Analysis</p>
    </div>

    <!-- Main Content Area -->
    <div id="app" class="hidden pb-20">
        <!-- Screens will be injected here -->
        <div id="screen-content"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md h-16 bg-white flex justify-around items-center bottom-nav z-40">
        <button onclick="navigate('home')" class="nav-btn text-[#E91E63] flex flex-col items-center">
            <span class="material-icons">home</span>
            <span class="text-[10px]">홈</span>
        </button>
        <button onclick="navigate('community')" class="nav-btn text-gray-400 flex flex-col items-center">
            <span class="material-icons">forum</span>
            <span class="text-[10px]">커뮤니티</span>
        </button>
        <button onclick="navigate('camera')" class="nav-btn text-gray-400 flex flex-col items-center">
            <span class="material-icons">photo_camera</span>
            <span class="text-[10px]">분석</span>
        </button>
        <button onclick="navigate('history')" class="nav-btn text-gray-400 flex flex-col items-center">
            <span class="material-icons">history</span>
            <span class="text-[10px]">기록</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
